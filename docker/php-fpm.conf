; php-fpm for the web UI. Replaces the image's default pool files.

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = /tmp/hdhomerun-web/php-fpm.sock
listen.mode = 0600

; A live analysis holds a worker for ~10 seconds while the page keeps polling tuner
; status every 2 seconds per tuner, so keep plenty of workers available.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
request_terminate_timeout = 120s

ping.path = /fpm-ping

; Pass HDHOMERUN_DEVICES and friends through to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
