<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skywave</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <h1>Skywave</h1>
    <form id="add-device" class="add-device">
      <input id="add-device-ip" type="text" inputmode="decimal" placeholder="Device IP, e.g. 192.168.1.50"
             pattern="\d{1,3}(\.\d{1,3}){3}" aria-label="Device IP address" required>
      <button type="submit">Add</button>
    </form>
    <button id="rescan" type="button" class="secondary">Rescan</button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>Devices</h2>
      <ul id="device-list" class="device-list">
        <li class="muted">Searching…</li>
      </ul>
    </aside>

    <section id="device-detail" class="detail" aria-live="polite">
      <p class="muted">Select a device.</p>
    </section>
  </main>

  <footer class="site-footer">
    Programme information and pictures courtesy of
    <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a>.
  </footer>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="vendor/hls/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
